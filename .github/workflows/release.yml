# 出し物を作る。札（tag）を打つと、四本の binary が土地ごとに建って降りる。
#
# ## 札と版の食い違いを、人ではなく機械が拒む
#
# 版は `src/version.ts` が正である。札だけ進めて版を上げ忘れる——これは
# 必ず起きる。起きた時、`honden update` は「降りてきた物のほうが古い」と
# 見て何もせぬ（`isNewer` が fail-closed ゆえ）。**黙って効かなくなる**のが
# 最も悪いので、出す前に照らして食い違えば出さぬ。
#
# ## 試験を通してから出す
#
# 出し物は取り消せぬ（取り消しても、既に降ろした者の手元は戻らぬ）。
# 建てる前に検める。

name: release

# ## 入口は札ひとつだけにする
#
# 以前は workflow_dispatch も置いておった。外した——署名の身元を
# **札から走った release.yml** に縛るゆえ、枝から走らせた出し物は
# 検めを通らぬ。通らぬ物を出せる口を残せば、いつか誰かがそれを出す。
# 打ち直したい時は、GitHub の画面から同じ run を回せばよい（ref は変わらぬ）。

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write     # Sigstore へ身元を示すため。**鍵は作らぬ**

jobs:
  # ── 一、札と版が合うておるか。合わねば、ここで止まる ──
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - id: pick
        # **仮の版（-rc.1 / -beta.1 / -alpha.1）を「最新」に据えぬ。**
        #
        # GitHub の `/releases/latest` は prerelease を外して返す。降ろす側は
        # そこしか見ぬゆえ、ここで印を付ければ**安定版の使い手に alpha が
        # 降ることは無い**。逆に印を付け忘れると、SemVer 上は
        # `0.2.0-alpha.1 > 0.1.0` ゆえ全員に降ってしまう。
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT"; echo "仮の版として出す: $tag" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "正式版として出す: $tag" ;;
          esac

      - name: 札と src/version.ts を照らす
        run: |
          set -euo pipefail
          tag='${{ steps.pick.outputs.tag }}'
          ver=$(grep -oE "VERSION = '[^']+'" src/version.ts | head -1 | cut -d"'" -f2)
          echo "札=$tag  版=$ver"
          if [ "$tag" != "v$ver" ]; then
            echo "::error::札 $tag と src/version.ts の $ver が食い違っておる。どちらかを揃えられよ。"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: 道具を入れる（bats に tmux が要る）
        run: sudo apt-get update && sudo apt-get install -y tmux bats

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bats tests/

  # ── 二、土地ごとに建てる ──
  build:
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest,   os: linux,  arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux,  arch: arm64 }
          - { runner: macos-14,        os: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile
      - run: bun run build:all

      - name: 土地の名を付ける
        run: |
          set -euo pipefail
          mkdir -p out
          for b in honden honden-bot honden-watch honden-parse; do
            cp "bin/$b" "out/$b-${{ matrix.os }}-${{ matrix.arch }}"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: honden-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  # ── 三、数を数えて、まとめて出す ──
  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: all, merge-multiple: true }

      - name: 数を数える
        # **名だけを並べる。** 道つきで数えると、降ろす側が名で引けぬ。
        #
        # `sha256sum -- * > SHA256SUMS` と書くと、glob の展開と書き出しの順に
        # 頼ることになる（bash は展開が先ゆえ動くが、読む者には分からぬ）。
        # 別の場所へ書いてから移す——**順に頼らぬ**。
        run: |
          set -euo pipefail
          cd all
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          echo "── 出す物 ──"
          cat SHA256SUMS

      - name: 揃うておるか（三つの土地 × 四本）
        run: |
          set -euo pipefail
          n=$(grep -c . all/SHA256SUMS)
          [ "$n" -eq 12 ] || { echo "::error::12 本のはずが $n 本しか無い"; exit 1; }

      # ── 署名する。**鍵は作らぬ（Sigstore keyless）** ──
      #
      # 署名するのは SHA256SUMS 一枚だけである。binary は既にその紙で
      # 縛られておるゆえ、紙を縛れば全部が縛られる:
      #
      #     署名 → SHA256SUMS → 各 binary
      #
      # 12 枚に署名しても強くはならず、検める段が増えるだけである。
      # **版を固定する。** 束の形は版で変わる——v3 が書く束は v2 では素で
      # 読めぬ。出す側が黙って上がると、降ろす側の下限（MIN_COSIGN）と
      # いつか食い違う。動く版を書いておき、上げる時は下限も一緒に見る。
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v3.1.3'

      - name: SHA256SUMS へ署名する
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle all/SHA256SUMS.cosign.bundle \
            all/SHA256SUMS
          echo "── 束 ──"
          ls -la all/SHA256SUMS.cosign.bundle

      - name: 出す前に、己で検める
        # **出した物を自分で検めておく。** 出してから「通らぬ」と分かるのでは
        # 遅い——既に降ろした者の手元は戻せぬ。降ろす側と同じ言葉で問う。
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle all/SHA256SUMS.cosign.bundle \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            all/SHA256SUMS
          echo "自分の署名を自分で検めた"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          files: all/*
          generate_release_notes: true
          prerelease: ${{ needs.gate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.gate.outputs.prerelease != 'true' }}
          body: |
            `honden update --check` で確かめ、`honden update --yes` で取り替えられる。

            ## 検め方

            `SHA256SUMS` は **Sigstore keyless で署名してある**（鍵は存在せぬ）。
            `honden update` は既定でこれを検め、通らねば**一つも置かぬ**。

            手で検めるなら:

            ```
            cosign verify-blob \
              --bundle SHA256SUMS.cosign.bundle \
              --certificate-identity-regexp '^https://github\.com/sousuke0422/honden/\.github/workflows/release\.yml@refs/tags/' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              SHA256SUMS
            sha256sum -c SHA256SUMS
            ```

            **身元の指定を省いてはならぬ。** 省くと *Sigstore で署名された物なら
            誰の物でも通る*——「署名がある」は「我らが署名した」ではない。

            **cosign は v3 以上が要る。** 束の形が版で変わるゆえ、v2 では素で読めぬ。
            素の apt が配るのは v2 のことがある（Ubuntu 26.04 は 2.6.2）。

            仮の版（`-rc` / `-beta` / `-alpha`）は prerelease として出るので、
            `honden update` には降りてこぬ。試すなら手で降ろされよ。
