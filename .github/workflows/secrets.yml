# 秘密の漏れを、履歴ごと検める。
#
# 公にする前、手で 2,966 の blob を舐めた（2026-09-01）。手で舐めた物は
# 二度目が無い。**押すたびに機械が舐める**形にする。
#
# 道具は betterleaks（gitleaks の作者らによる後継・MIT）。
# 取り方は release.yml と同じ流儀——**数と署名で釘を打ち、合わねば止まる。**
#
#   紙（checksums.txt）の数を焼き付ける   → 版を黙って上げられぬ
#   紙の署名を Sigstore で検める          → 出し物の身元を上流の workflow に釘付け
#   tarball を紙で検める                  → 中身の入れ替えを弾く
#
# 検める前に**陽性対照**を踏む。偽の鍵を植えた repo で鳴らぬなら、
# 道具が壊れておるのであり、honden が清いのではない。
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  BL_VERSION: '1.8.1'
  # checksums.txt の sha256。版を上げる時はここも上げる（黙っては上がらぬ）
  BL_SUMS_SHA256: '08caab663c63b92f976014986cecd54e9411033578ff46a8de2c2ccbbfba5da5'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0        # 履歴ごと見る。浅いと最新の樹しか舐めぬ

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6   # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: betterleaks を取り、数と署名で検める
        run: |
          set -euo pipefail
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BL_VERSION}"
          mkdir -p /tmp/bl && cd /tmp/bl
          for f in checksums.txt checksums.txt.sigstore.json "betterleaks_${BL_VERSION}_linux_x64.tar.gz"; do
            curl -sSfL --retry 3 -o "$f" "$base/$f"
          done

          # 一、紙の数。焼き付けた物と一字でも違えば止まる
          echo "${BL_SUMS_SHA256}  checksums.txt" | sha256sum -c -

          # 二、紙の署名。身元は上流の release workflow と札に釘付け
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/betterleaks/betterleaks/.github/workflows/release.yml@refs/tags/v${BL_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          # 三、tarball を紙で検める
          grep " betterleaks_${BL_VERSION}_linux_x64.tar.gz\$" checksums.txt | sha256sum -c -
          tar -xzf "betterleaks_${BL_VERSION}_linux_x64.tar.gz" betterleaks
          ./betterleaks version

      - name: 陽性対照——偽の鍵を植えた repo で鳴るか
        run: |
          set -euo pipefail
          d=$(mktemp -d) && cd "$d"
          git init -q && git config user.email x@example.com && git config user.name x
          # 形だけ本物に似せた偽物。実在せぬ。
          #
          # **一色の文字列（AAAA…）では鳴らぬ。** 道具は「人が書いた物か」を
          # 文字の珍しさで濾すゆえ、偽物も乱雑でなければ秘密に見えぬ
          # （初回の対照がこれで落ちた・2026-09-02）。
          #
          # **偽物をこの書に文字で置いてはならぬ。** 置けば commit の履歴に
          # 残り、道具は毎回それを釣る（二回目の対照がこれで落ちた。
          # a3d2bfe の分は .betterleaksignore で見逃させてある）。
          # 走らせる時に、決まった文から刻んで組み立てる——同じ物が毎回
          # できるが、書のどこにも鍵の形は無い。
          h=$(printf 'honden positive control' | sha256sum | cut -d' ' -f1)
          printf 'github_token = "ghp_%s"\n' "${h:0:36}" > leak.txt
          printf 'aws_access_key_id = "AKIA%s"\n' "$(printf '%s' "$h" | tr 'a-f' 'A-F' | tr -d '0-9' | head -c 16)" >> leak.txt
          git add leak.txt && git commit -qm plant
          if /tmp/bl/betterleaks git . --redact >/dev/null 2>&1; then
            echo "::error::植えた鍵で鳴らぬ。道具が壊れておる——honden を検めても意味が無い"
            exit 1
          fi
          echo "陽性対照: 鳴った"

      - name: honden の履歴を舐める
        run: |
          set -euo pipefail
          /tmp/bl/betterleaks git . --redact -v
