# 押すたびに検める。
#
# 出す時（release.yml）にも同じ検めを置いてあるが、そこで初めて落ちるのでは
# 遅い——札を打った後に直すことになる。**手前で落とす。**

name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: dtolnay/rust-toolchain@stable

      - name: 道具を入れる（bats に tmux が要る）
        run: sudo apt-get update && sudo apt-get install -y tmux bats

      - run: bun install --frozen-lockfile
      - run: bun run typecheck

      # **試験より先に建てる。** 門の試験は本物の解析器（bin/honden-parse）を
      # 呼ぶ。bin/ は追跡しておらぬゆえ、建てねば CI には一本も無い——
      # 手元では古い物が居座っており、それで通っておった（実測 2026-08-30・
      # 初めての札 v0.1.0-rc.1 が門で止まった）。
      - run: bun run build:all

      - run: bun test
      - run: bats tests/

      - name: 出陣の書は bash として通るか
        run: bash -n scripts/shutsujin.sh shutsujin_departure.sh scripts/first_setup.sh
