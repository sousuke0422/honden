[package]
name = "honden-parse"
version = "0.1.0"
edition = "2021"
description = "命を構文で解き、門へ構造を渡す。解けぬ形は解けぬと言う"

# **芯（core/watch）とは別の crate である。**
#
# 芯は依存を一つも持たぬ——常駐する側は、他のすべてが壊れた時にも生きて
# いなければならぬゆえ。こちらは常駐せぬ（門が呼ぶたびに起きて死ぬ）。
# ゆえに借り物を許す。混ぜてはならぬ。
#
# brush-parser を選んだ理由は docs/decisions.md 百四十九:
# - MIT（honden も MIT。yash-syntax は GPL ゆえ採れぬ）
# - 実 bash と約 1,700 の照合試験。配下は皆 bash で走るゆえ
#   `[[ ]]` も `((` も `<(...)` も日常の往来である
# - 壊れた入力で**落ちる**。黙って読み違えぬ（tree-sitter は回復するゆえ退けた）

[dependencies]
# crates の 0.4.0 から、upstream main の rev へ上げた。0.4.0 の後に
# 引用を外す処理・here-doc・`$(...)` の終わり・行の継ぎの直しが入っておる。
# branch で指さぬ——打つたびに別の解き手になれば、門の判じが黙って替わる。
brush-parser = { git = "https://github.com/reubeno/brush", rev = "ea0781d3e7e02496fb4ebf32653baf51bb227f73" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
